name: Update tracking data
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_data.py out/data.json
      - name: Publish to data branch (single commit, no history growth)
        working-directory: out
        run: |
          git init -q -b data
          git config user.name "tracking-bot"
          git config user.email "tracking-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Data $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
