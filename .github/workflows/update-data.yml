name: Update tracking data
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_data.py data.json
      - name: Commit if changed
        run: |
          git config user.name "tracking-bot"
          git config user.email "tracking-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update data.json" && git push)
