<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1d2a">
<title>ARWC Live</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#0b1d2a;--panel:#10283a;--panel2:#173650;--text:#eaf3f9;--mute:#8fa9bb;--accent:#ffb300;--ok:#3ddc97;--line:#23465f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#map{position:fixed;inset:0}
header{position:fixed;top:0;left:0;right:0;z-index:1000;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;gap:8px;align-items:center;background:linear-gradient(var(--bg),rgba(11,29,42,.0))}
.pill{background:rgba(16,40,58,.92);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:600;backdrop-filter:blur(8px)}
.live{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}
.grow{flex:1}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:1001;background:var(--panel);border-radius:18px 18px 0 0;border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(0,0,0,.4);height:78vh;transform:translateY(calc(78vh - 150px));transition:transform .25s ease;display:flex;flex-direction:column;touch-action:none}
#sheet.open{transform:translateY(0)}
#sheet.dragging{transition:none}
.grab{padding:8px 0 4px;display:flex;justify-content:center;cursor:grab}
.grab i{width:42px;height:5px;border-radius:3px;background:var(--line)}
.sbar{padding:4px 12px 10px}
input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:11px 12px;font-size:16px;outline:none}
.tabs{display:flex;gap:6px;padding:0 12px 8px}
.tab{flex:1;min-width:0;text-align:center;padding:7px;border-radius:10px;background:var(--panel2);color:var(--mute);font-weight:600;border:0;font-size:14px}
.tab.on{background:var(--accent);color:#1a1200}
#list{overflow-y:auto;flex:1;padding:0 8px calc(env(safe-area-inset-bottom) + 16px);touch-action:pan-y;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line)}
.rank{min-width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;background:var(--panel2)}
.row:nth-child(-n+3) .rank{background:var(--accent);color:#1a1200}
.info{flex:1;min-width:0}
.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mute);font-size:13px}
.bar{height:5px;background:var(--panel2);border-radius:3px;margin-top:6px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--ok)}
.right{text-align:right;font-variant-numeric:tabular-nums}
.right .km{font-weight:700}
.flag{font-size:20px}
.star{background:none;border:0;color:var(--mute);font-size:24px;line-height:1;padding:6px 4px;cursor:pointer}
.star.on{color:var(--accent)}
.fbtn{flex:0 0 auto;padding:7px 12px}
#detail{display:none;padding:4px 14px 16px;overflow-y:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.card{background:var(--panel2);border-radius:12px;padding:10px 12px}
.card small{color:var(--mute);display:block}
.card strong{font-size:20px}
.back{background:none;border:0;color:var(--accent);font-size:15px;font-weight:600;padding:6px 0}
.mk{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#1a1200;font-weight:800;font-size:12px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.mk.sel{background:#ff4d6d;color:#fff;transform:scale(1.25)}
.cp{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #1b6ca8}
.leaflet-control-zoom{display:none}
header .pill{white-space:nowrap;font-size:13px;padding-left:10px;padding-right:10px}
.me{width:22px;height:22px;position:relative}
.me i{position:absolute;inset:3px;border-radius:50%;background:#2f7bff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,123,255,.25),0 2px 6px rgba(0,0,0,.5)}
.me b{position:absolute;left:50%;top:-14px;margin-left:-7px;border:7px solid transparent;border-bottom:12px solid #2f7bff;display:none;transform-origin:7px 25px}
.me.dir b{display:block}
.cards .card{cursor:pointer}
.times{margin:0 0 12px;padding:0;list-style:none;font-variant-numeric:tabular-nums}
.times li{display:flex;justify-content:space-between;gap:10px;padding:6px 2px;border-bottom:1px solid var(--line);font-size:14px}
.times li.done span:last-child{color:var(--text);font-weight:600}
.times li span:last-child{color:var(--mute)}
.photo{width:100%;border-radius:12px;margin:8px 0;display:block}
.demo{position:fixed;top:calc(env(safe-area-inset-top) + 52px);left:12px;z-index:1000;font-size:12px;color:#1a1200;background:var(--accent);padding:3px 8px;border-radius:6px;font-weight:700}
</style>
</head>
<body>
<div id="map"></div>
<header>
  <div class="pill live"><span class="dot"></span><span id="clock">LIVE</span></div>
  <div class="pill" id="next" style="margin-left:8px;color:var(--mute)">Next –</div>
  <div class="grow"></div>
  <button class="pill" id="loc" style="color:var(--text);margin-right:8px">◎</button>
  <button class="pill" id="fit" style="color:var(--text)">Course</button>
</header>

<section id="sheet">
  <div class="grab" id="grab"><i></i></div>
  <div id="main" style="display:flex;flex-direction:column;min-height:0;flex:1">
    <div class="sbar"><input id="q" type="search" placeholder="Search team or nation…" autocomplete="off"></div>
    <div class="tabs">
      <button class="tab on" data-s="rank">Standings</button>
      <button class="tab" data-s="speed">Speed</button>
      <button class="tab" data-s="seen">Last seen</button>
      <button class="tab fbtn" id="favOnly" title="Show only favourites">★ <span id="favN">0</span></button>
    </div>
    <div id="list"></div>
  </div>
  <div id="detail"></div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ===== DATA-LAGER =====
   data.json is created by tools/fetch_data.py (ARWC2026 from follow.me.cz) and refreshed by GitHub Actions. */
let COURSE=[],CHECKPOINTS=[],TOTAL=0,prev={},genAt=0;
const CYCLE=6.5*60000; // cron 5 min + ~1.5 min run time
const REMOTE='https://raw.githubusercontent.com/StefanKindgren/Tracking/data/';
async function getJSON(path){
  for(const base of [REMOTE,'']){try{const r=await fetch(base+path+'?'+Math.floor(Date.now()/60000),{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}}
  throw new Error('no data');
}
async function fetchTeams(){
  const j=await getJSON('data.json');
  if(!COURSE.length){COURSE=j.course;CHECKPOINTS=j.checkpoints;TOTAL=j.total_km;initCourse()}
  document.title=j.race+' – live';genAt=new Date(j.generated).getTime();
  const gen=new Date(j.generated).getTime();
  return j.teams.map(t=>{
    const seen=t.seen?new Date(t.seen).getTime():gen,p=prev[t.id];let speed=p?p.speed:0;
    if(p&&seen>p.seen){speed=Math.max(0,(t.km-p.km)/((seen-p.seen)/3600000))}
    prev[t.id]={km:t.km,seen,speed};
    return{id:t.id,name:t.name,no:t.no,flag:t.flag,lat:t.lat,lng:t.lng,km:t.km,rank:t.rank,speed,lastSeen:seen,
      cpPassed:CHECKPOINTS.filter(c=>c.km<=t.km).length,
      status:t.finish?'Finished':t.lost?'Signal lost':'On course'}});
}

/* ===== KARTA ===== */
const map=L.map('map',{zoomControl:false,attributionControl:false}).setView([42.45,8.95],9);
L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:15}).addTo(map);
L.control.attribution({prefix:false}).addTo(map).addAttribution('© OpenStreetMap, OpenTopoMap');
let route;const FIT={paddingTopLeft:[10,60],paddingBottomRight:[10,170]};
function initCourse(){
  route=L.polyline(COURSE,{color:'#1b6ca8',weight:5,opacity:.85}).addTo(map);
  CHECKPOINTS.forEach(c=>L.marker([c.lat,c.lng],{icon:L.divIcon({className:'',html:'<div class="cp"></div>',iconSize:[12,12]})}).addTo(map).bindTooltip(c.name,{direction:'top'}));
  map.fitBounds(route.getBounds(),FIT);
}
document.getElementById('fit').onclick=()=>{closeDetail();if(route)map.fitBounds(route.getBounds(),FIT)};

/* ===== UI ===== */
const sheet=document.getElementById('sheet'),listEl=document.getElementById('list'),q=document.getElementById('q');
let teams=[],markers={},selected=null,sortBy='rank',favOnly=false;
let favs=new Set();
try{favs=new Set(JSON.parse(localStorage.getItem('favs')||'[]'));favOnly=localStorage.getItem('favOnly')==='1'}catch(e){}
const saveFavs=()=>{try{localStorage.setItem('favs',JSON.stringify([...favs]));localStorage.setItem('favOnly',favOnly?'1':'0')}catch(e){}};
const shown=t=>!favOnly||favs.has(t.id);
function syncFav(){const b=document.getElementById('favOnly');b.classList.toggle('on',favOnly);document.getElementById('favN').textContent=favs.size}
function toggleFav(id){favs.has(id)?favs.delete(id):favs.add(id);if(!favs.size)favOnly=false;saveFavs();syncFav();upsertMarkers();render();drawTracks();if(selected)select(selected,true)}
const fmtAgo=ms=>{const s=Math.round((Date.now()-ms)/1000);return s<60?s+' s ago':Math.round(s/60)+' min ago'};
function ranked(){return [...teams].sort((a,b)=>(a.rank||999)-(b.rank||999)||b.km-a.km).map((t,i)=>({...t,rank:i+1}))}
function render(){
  let r=ranked().filter(shown);const s=q.value.trim().toLowerCase();
  if(s)r=r.filter(t=>t.name.toLowerCase().includes(s));
  if(sortBy==='speed')r.sort((a,b)=>b.speed-a.speed);
  if(sortBy==='seen')r.sort((a,b)=>b.lastSeen-a.lastSeen);
  listEl.innerHTML=r.map(t=>`<div class="row" data-id="${t.id}">
    <div class="rank">${t.rank}</div>
    <div class="info"><div class="name"><span class="flag">${t.flag}</span> ${t.name}</div>
      <div class="sub">CP ${t.cpPassed}/${CHECKPOINTS.length} · ${t.speed.toFixed(1)} km/h</div>
      <div class="bar"><b style="width:${(t.km/TOTAL*100).toFixed(1)}%"></b></div></div>
    <div class="right"><div class="km">${(TOTAL-t.km).toFixed(0)} km</div><div class="sub">to go</div></div>
    <button class="star${favs.has(t.id)?' on':''}" data-fav="${t.id}" aria-label="Favourite">${favs.has(t.id)?'★':'☆'}</button></div>`).join('')||`<p class="sub" style="padding:16px">${favOnly?'No favourites match.':'No teams found.'}</p>`;
}
function upsertMarkers(){
  ranked().forEach(t=>{
    if(!shown(t)&&t.id!==selected){if(markers[t.id]){map.removeLayer(markers[t.id]);delete markers[t.id]}return}
    const html=`<div class="mk${selected===t.id?' sel':''}">${t.rank}</div>`;
    if(!markers[t.id]){markers[t.id]=L.marker([t.lat,t.lng],{icon:L.divIcon({className:'',html,iconSize:[28,28]})}).addTo(map).on('click',()=>select(t.id))}
    else{markers[t.id].setLatLng([t.lat,t.lng]);markers[t.id].setIcon(L.divIcon({className:'',html,iconSize:[28,28]}))}
  });
}
const detailCache={},trackLayers={};let cpOpen=false;
async function loadDetail(id){
  if(detailCache[id]&&Date.now()-detailCache[id].at<120000)return detailCache[id];
  try{const d=await getJSON('teams/'+id+'.json');d.at=Date.now();detailCache[id]=d;return d}catch(e){return detailCache[id]||null}
}
async function drawTracks(){
  const want=new Map();if(selected)want.set(selected,'#ff4d6d');if(favOnly)favs.forEach(id=>{if(!want.has(id))want.set(id,'#ffb400')});
  Object.keys(trackLayers).forEach(id=>{if(!want.has(+id)){map.removeLayer(trackLayers[id]);delete trackLayers[id]}});
  for(const [id,color] of want){
    const d=await loadDetail(id);if(!d||!d.track.length||!(id===selected||favOnly&&favs.has(id)))continue;
    if(trackLayers[id])trackLayers[id].setLatLngs(d.track).setStyle({color});
    else trackLayers[id]=L.polyline(d.track,{color,weight:3,opacity:.9}).addTo(map);
  }
}
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function select(id,refresh){
  const changed=selected!==id;selected=id;const t=ranked().find(x=>x.id===id);if(!t)return;
  if(changed)cpOpen=false;
  if(!refresh){map.flyTo([t.lat,t.lng],12,{duration:.6});setSheet(false)}
  document.getElementById('main').style.display='none';
  const d=document.getElementById('detail');d.style.display='block';
  const x=detailCache[id],r=x&&x.racer,times=x?x.times:[];
  const done=times.filter(c=>c.time&&c.time!=='-').length;
  const cpTxt=x?`${done}/${times.length}`:`${t.cpPassed}/${CHECKPOINTS.length}`;
  const st=(k,v)=>v?`<div class="card"><small>${k}</small><strong style="font-size:17px">${esc(v)}</strong></div>`:'';
  d.innerHTML=`<button class="back" id="bk">← All teams</button>
   <h2 style="margin:4px 0;display:flex;align-items:center;gap:6px"><span style="flex:1">${t.flag} ${esc(t.name)} <small style="color:var(--mute)">#${esc(t.no)}</small></span><button class="star${favs.has(t.id)?' on':''}" data-fav="${t.id}" aria-label="Favourite">${favs.has(t.id)?'★':'☆'}</button></h2>
   <div class="sub">${t.status} · last seen ${fmtAgo(t.lastSeen)}${r&&r.battery_level?' · 🔋 '+esc(r.battery_level):''}</div>
   ${r&&r.photo?`<img class="photo" src="${esc(r.photo)}" alt="" loading="lazy" onerror="this.remove()">`:''}
   <div class="grid cards">
    <div class="card"><small>Rank</small><strong>#${t.rank}</strong></div>
    <div class="card"><small>Speed</small><strong>${r&&r.speed?esc(r.speed):t.speed.toFixed(1)+' km/h'}</strong></div>
    <div class="card"><small>Covered</small><strong>${t.km.toFixed(0)} km</strong></div>
    <div class="card"><small>Remaining</small><strong>${(TOTAL-t.km).toFixed(0)} km</strong></div>
    <div class="card" id="cpCard"><small>Checkpoints ${cpOpen?'▴':'▾'}</small><strong>${cpTxt}</strong></div>
    <a class="card" href="https://www.google.com/maps/search/?api=1&query=${t.lat},${t.lng}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><small>Position · open in Google Maps ↗</small><strong style="font-size:14px;text-decoration:underline">${t.lat.toFixed(4)}, ${t.lng.toFixed(4)}</strong></a>
    ${r?st('Pace',r.pace)+st('VAM',r.vam)+st('Altitude',r.altitude)+st('Moving time',r.moving_time)+st('Standing time',r.standing_time)+st('Category',r.category_name):''}
   </div>
   ${cpOpen?`<ul class="times">${times.map(c=>{const ok=c.time&&c.time!=='-';return`<li class="${ok?'done':''}"><span>${esc(c.name)}</span><span>${ok?esc(c.time):'–'}</span></li>`}).join('')||'<li><span>Loading…</span></li>'}</ul>`:''}
   <div class="bar" style="height:8px"><b style="width:${(t.km/TOTAL*100).toFixed(1)}%"></b></div>`;
  document.getElementById('bk').onclick=closeDetail;
  d.querySelector('[data-fav]').onclick=()=>toggleFav(t.id);
  document.getElementById('cpCard').onclick=()=>{cpOpen=!cpOpen;select(id,true)};
  upsertMarkers();
  if(!x||Date.now()-x.at>=120000)loadDetail(id).then(()=>{if(selected===id)select(id,true)});
  drawTracks();
}
function closeDetail(){selected=null;drawTracks();document.getElementById('detail').style.display='none';document.getElementById('main').style.display='flex';upsertMarkers()}
listEl.onclick=e=>{const f=e.target.closest('[data-fav]');if(f){toggleFav(+f.dataset.fav);return}const r=e.target.closest('.row');if(r)select(+r.dataset.id)};
document.getElementById('favOnly').onclick=()=>{
  if(!favs.size&&!favOnly){alert('Tap ☆ on a team to add it to your favourites first.');return}
  favOnly=!favOnly;saveFavs();syncFav();upsertMarkers();render();drawTracks();
  if(favOnly&&route){const pts=teams.filter(t=>favs.has(t.id)).map(t=>[t.lat,t.lng]);if(pts.length)map.fitBounds(pts,{...FIT,maxZoom:12})}
};
syncFav();
q.oninput=render;
document.querySelectorAll('.tab[data-s]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab[data-s]').forEach(x=>x.classList.remove('on'));b.classList.add('on');sortBy=b.dataset.s;render()});

/* ===== Dragbart bottenpanel ===== */
const PEEK=150;let startY=0,startOff=0,dragging=false;
const maxOff=()=>sheet.offsetHeight-PEEK;
function setSheet(open){sheet.style.transform='';sheet.classList.toggle('open',open)}
const grab=document.getElementById('grab');
grab.addEventListener('touchstart',e=>{dragging=true;startY=e.touches[0].clientY;startOff=sheet.classList.contains('open')?0:maxOff();sheet.classList.add('dragging')},{passive:true});
grab.addEventListener('touchmove',e=>{if(!dragging)return;const off=Math.max(0,Math.min(maxOff(),startOff+e.touches[0].clientY-startY));sheet.style.transform=`translateY(${off}px)`},{passive:true});
grab.addEventListener('touchend',e=>{dragging=false;sheet.classList.remove('dragging');const m=new DOMMatrix(getComputedStyle(sheet).transform).m42;setSheet(m<maxOff()/2)});
grab.onclick=()=>setSheet(!sheet.classList.contains('open'));
q.addEventListener('focus',()=>setSheet(true));

/* ===== My position + heading ===== */
let meMarker=null,meHeading=null,meOn=false,lastFix=null;
function meIcon(){return L.divIcon({className:'',html:`<div class="me${meHeading!=null?' dir':''}"><b style="transform:rotate(${meHeading||0}deg)"></b><i></i></div>`,iconSize:[22,22]})}
function setHeading(h){if(h==null||isNaN(h))return;meHeading=(h+360)%360;if(meMarker)meMarker.setIcon(meIcon())}
function onFix(p){
  const ll=[p.coords.latitude,p.coords.longitude];lastFix=ll;
  if(!meMarker){meMarker=L.marker(ll,{icon:meIcon(),zIndexOffset:1000,interactive:false}).addTo(map);if(meOn)map.flyTo(ll,Math.max(map.getZoom(),12),{duration:.6});meOn=false}
  else meMarker.setLatLng(ll);
  if(p.coords.heading!=null&&!isNaN(p.coords.heading)&&(p.coords.speed||0)>0.5)setHeading(p.coords.heading);
}
function onOrient(e){
  const h=e.webkitCompassHeading!=null?e.webkitCompassHeading:(e.absolute&&e.alpha!=null?360-e.alpha:null);
  setHeading(h);
}
async function startMe(){
  if(!navigator.geolocation){alert('Location is not available in this browser.');return}
  meOn=true;
  if(lastFix){map.flyTo(lastFix,Math.max(map.getZoom(),12),{duration:.6});return}
  try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission){if(await DeviceOrientationEvent.requestPermission()==='granted')addEventListener('deviceorientation',onOrient,true)}
      else{addEventListener('deviceorientationabsolute',onOrient,true);addEventListener('deviceorientation',onOrient,true)}}catch(e){}
  navigator.geolocation.watchPosition(onFix,err=>{alert('Could not get your position: '+err.message)},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
document.getElementById('loc').onclick=startMe;

/* ===== Countdown to next data update ===== */
const nextEl=document.getElementById('next');
setInterval(()=>{
  if(!genAt){return}
  const left=genAt+CYCLE-Date.now();
  if(left>0){const s=Math.ceil(left/1000);nextEl.textContent='Next ≈ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
  else{nextEl.textContent='Updating…';if(!window._poll||Date.now()-window._poll>15000){window._poll=Date.now();tick()}}
},1000);

/* ===== Loop ===== */
async function tick(){
  try{teams=await fetchTeams();upsertMarkers();if(!dragging&&!q.matches(':focus')&&document.getElementById('main').style.display!=='none')render();
    document.getElementById('clock').textContent='LIVE '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    if(selected)select(selected,true)}
  catch(e){document.getElementById('clock').textContent='Offline'}
}
tick();setInterval(tick,60000);
</script>
</body>
</html>
